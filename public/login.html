<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Entrar — NEXUMBRAL</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@500&display=swap">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0B1F3B;color:#F5F0E5;font:15px Montserrat,system-ui,sans-serif}.c{width:min(380px,92vw);text-align:center}svg{width:72px;height:72px}h1{font:500 32px Playfair Display,Georgia,serif;letter-spacing:.04em;margin:4px 0}.t{color:#D4AF7C;letter-spacing:.3em;font-size:10px;margin:0}.s{margin:14px 0 20px}form{display:grid;gap:10px;text-align:left}input{font:inherit;color:#F5F0E5;background:rgba(245,240,229,.07);border:1px solid rgba(245,240,229,.2);border-radius:10px;padding:12px}button{font:600 14px Montserrat,sans-serif;border-radius:10px;padding:12px;cursor:pointer;border:1px solid #D4AF7C}.g{background:#D4AF7C;color:#0B1F3B}.o{background:none;color:#F5F0E5;margin-top:10px;width:100%}#e{color:#f0a0a0;min-height:20px;font-size:13px}:focus-visible{outline:2px solid #3B82F6;outline-offset:2px}[hidden]{display:none}</style></head><body><div class="c">
<svg viewBox="0 0 100 100" role="img" aria-label="NEXUMBRAL"><path d="M10 94V38L50 8l40 30v56" fill="none" stroke="#F5F0E5" stroke-width="8"/><path d="M26 94V46l24-18 24 18v48" fill="none" stroke="#D4AF7C" stroke-width="6"/><path d="M40 94V55l10-8 10 8v39" fill="none" stroke="#F5F0E5" stroke-width="5"/><path d="M50 52l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#D4AF7C"/><path d="M34 95h32L50 80z" fill="#D4AF7C"/></svg>
<h1>NEXUMBRAL</h1><p class="t">A ARTE DE DECIFRAR</p><p class="s">Desvende. Pense. Evolua.</p>
<form><input id="n" placeholder="Nome" autocomplete="name" aria-label="Nome" hidden><input id="em" type="email" placeholder="E-mail" autocomplete="email" aria-label="E-mail" required><input id="pw" type="password" placeholder="Senha (mínimo 8 caracteres)" aria-label="Senha" minlength="8" required><div id="e" role="alert"></div><button class="g" id="go">Entrar</button></form>
<button class="o" id="sw" type="button">Criar uma conta</button></div>
<script>let reg=false;const $=s=>document.querySelector(s);
function mode(){$("#n").hidden=!reg;$("#n").required=reg;$("#go").textContent=reg?"Criar conta":"Entrar";$("#sw").textContent=reg?"Já tenho conta":"Criar uma conta";$("#pw").autocomplete=reg?"new-password":"current-password"}
$("#sw").onclick=()=>{reg=!reg;mode()};
$("form").onsubmit=async e=>{e.preventDefault();$("#e").textContent="";const r=await fetch(reg?"/api/register":"/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:$("#n").value,email:$("#em").value,password:$("#pw").value})}),j=await r.json().catch(()=>({}));r.ok?location="/":$("#e").textContent=j.erro||"Não foi possível entrar."};mode();</script></body></html>
